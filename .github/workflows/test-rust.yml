name: Rust tests

# The workspace's tests and layering check on each runner in `os` (a JSON list), for CI and CI
# on label, plus the release build on pushes and manual runs.

on:
  workflow_call:
    inputs:
      os:
        description: Runners to test on, as a JSON list
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.os) }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Tests
        run: cargo test --workspace --locked
      - name: Layering check
        run: cargo xtask layers
      # A full optimised build: on pushes (dev, main) and manual runs, not on every pull request,
      # where the tests above already compile everything.
      - name: Build release apps
        if: github.event_name != 'pull_request'
        run: cargo build --release --locked -p rustgis -p rustgis-cli
