[package]
name = "geoflux-report"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "GeoFlux L1: inspection report templates and pages, written as vector PDFs with the original photos embedded"

[lints]
workspace = true

[dependencies]
geoflux-domain = { workspace = true }
miniz_oxide = { workspace = true }
pdf-writer = "0.15"
png = "0.18"
# Bulk exports: one PDF per asset, stored (PDFs are already compressed).
zip = { version = "2", default-features = false, features = ["deflate"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
image = { workspace = true, features = ["jpeg"] }
