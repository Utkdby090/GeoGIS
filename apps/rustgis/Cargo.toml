[package]
name = "rustgis"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
default-run = "geogis"
description = "GeoGIS desktop app"

# The program is `geogis`; the package keeps RustGIS's name so merges from RustGIS stay simple.
[[bin]]
name = "geogis"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
rustgis-engine = { workspace = true, features = ["geolibre"] }
rustgis-ui-egui = { workspace = true }
eframe = { workspace = true, features = ["default_fonts", "links", "wgpu", "accesskit", "wayland", "x11"] }
egui = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }

# The Windows exe icon (build.rs). Gated on the host, so other platforms build neither.
[target.'cfg(windows)'.build-dependencies]
tiny-skia = { workspace = true }
embed-resource = "3"
